<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tijdelijk niet beschikbaar</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f4f4; color: #222; }
    main { max-width: 32rem; margin: 1rem; padding: 2rem 2.25rem; background: #fff; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
    p { margin: .5rem 0; line-height: 1.5; }
    .en { color: #666; font-size: .95rem; }
    a.retry { display: inline-block; margin-top: 1rem; padding: .55rem 1.1rem; background: #2b5797; color: #fff; text-decoration: none; border-radius: 4px; }
    a.retry:hover, a.retry:focus { background: #1e3f6f; }
    @media (prefers-color-scheme: dark) {
      body { background: #151515; color: #e6e6e6; }
      main { background: #222; border-color: #3a3a3a; box-shadow: none; }
      .en { color: #aaa; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Tijdelijk niet beschikbaar</h1>
    <p>Deze pagina kan op dit moment niet worden getoond. Er is een storing opgetreden. Probeer het over enkele minuten opnieuw.</p>
    <p class="en">This page is temporarily unavailable. Please try again in a few minutes.</p>
    <a class="retry" href="default.aspx">Opnieuw proberen</a>
  </main>
</body>
</html>
